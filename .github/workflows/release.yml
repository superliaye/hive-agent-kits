name: release

on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hive-stable-release
  cancel-in-progress: false

jobs:
  build-shell:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    strategy:
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            uname: arm64
          - architecture: x64
            runner: macos-15-intel
            uname: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"
      - run: bun install --frozen-lockfile
      - name: Build native Shell
        env:
          HIVE_RELEASE_ID: g${{ github.event.workflow_run.head_sha }}
          HIVE_RELEASE_BUILD_VERSION: 0.0.0-g${{ github.event.workflow_run.head_sha }}
          HIVE_RELEASE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          HIVE_RELEASE_PROTOCOL_RANGE: "1"
        run: |
          export HIVE_RELEASE_BUILD_VERSION="${HIVE_RELEASE_BUILD_VERSION:0:20}"
          bun run ship
      - name: Smoke-test and archive Shell
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          app="packages/shell/release/Hive-darwin-$ARCHITECTURE/Hive.app"
          test -x "$app/Contents/MacOS/Hive"
          "$app/Contents/MacOS/Hive" --version
          jq -e --arg commit "$SOURCE_COMMIT" \
            '.releaseId == ("g" + $commit) and .sourceCommit == $commit and .protocolRange == "1"' \
            "$app/Contents/Resources/hive-release.json"
          tar -czf "Hive-darwin-$ARCHITECTURE.tar.gz" \
            -C "packages/shell/release/Hive-darwin-$ARCHITECTURE" Hive.app
      - uses: actions/upload-artifact@v4
        with:
          name: shell-darwin-${{ matrix.architecture }}
          path: Hive-darwin-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  build-daemon:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: test "$(uname -m)" = x86_64
      - run: bun install --frozen-lockfile
      - name: Build standalone Daemon
        run: >-
          bun build --compile --target=bun-linux-x64
          packages/daemon/src/server/start.ts
          --outfile hive-daemon-linux-x64
      - name: Smoke-test standalone Daemon
        env:
          BUILD_VERSION: 0.0.0-g${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          export BUILD_VERSION="${BUILD_VERSION:0:20}"
          smoke_home="$(mktemp -d)"
          daemon_pid=''
          cleanup() {
            test -z "$daemon_pid" || kill "$daemon_pid" 2>/dev/null || true
            test -z "$daemon_pid" || wait "$daemon_pid" 2>/dev/null || true
            rm -rf -- "$smoke_home"
          }
          trap cleanup EXIT
          chmod 755 hive-daemon-linux-x64
          HOME="$smoke_home" HIVE_PACKAGED=1 HIVE_BUILD_VERSION="$BUILD_VERSION" \
            HIVE_PORT=43117 ./hive-daemon-linux-x64 >"$smoke_home/daemon.log" 2>&1 &
          daemon_pid=$!
          for _ in $(seq 1 100); do
            test ! -f "$smoke_home/.hive/.token" || break
            sleep 0.1
          done
          token="$(cat "$smoke_home/.hive/.token")"
          curl --fail --silent --show-error --retry 50 --retry-all-errors --retry-delay 0 \
            -H "Authorization: Bearer $token" http://127.0.0.1:43117/api/ready |
            jq -e --arg build "$BUILD_VERSION" \
              '.status == "ok" and .buildVersion == $build and .protocolVersion == 1 and .daemonMode == "packaged"'
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-x64
          path: hive-daemon-linux-x64
          if-no-files-found: error

  publish:
    needs: [build-shell, build-daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*-*'
          path: release-assets
          merge-multiple: true
      - name: Build and validate release manifest
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          build_version="0.0.0-g${SOURCE_COMMIT:0:12}"
          published_at="$(date -u -d "@$(git show -s --format=%ct "$SOURCE_COMMIT")" +%Y-%m-%dT%H:%M:%SZ)"
          asset_base="https://github.com/$GITHUB_REPOSITORY/releases/download/hive-g$SOURCE_COMMIT/"
          bun run release:manifest -- \
            --assets release-assets \
            --output stable.json \
            --repository "https://github.com/$GITHUB_REPOSITORY.git" \
            --commit "$SOURCE_COMMIT" \
            --build-version "$build_version" \
            --published-at "$published_at" \
            --asset-base-url "$asset_base"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')" = "$SOURCE_COMMIT"
          scripts/publish-immutable-release.sh \
            --source-commit "$SOURCE_COMMIT" \
            --assets release-assets \
            --manifest stable.json
      - name: Advance stable channel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh auth setup-git
          scripts/publish-stable-channel.sh \
            --repository "https://github.com/$GITHUB_REPOSITORY.git" \
            --manifest stable.json \
            --expected-main "$SOURCE_COMMIT"
